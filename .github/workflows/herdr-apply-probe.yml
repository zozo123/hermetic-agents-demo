name: herdr-apply-probe

on:
  push:
    paths:
      - '.github/workflows/herdr-apply-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture Herdr application screen
        shell: bash
        run: |
          set +e
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 join.herdr.dev >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -q -t ed25519 -N '' -f /tmp/herdr_applicant_key
          echo '--- session ---'
          timeout 20s bash -lc 'tail -f /dev/null | script -qefc "stty rows 45 cols 140; export TERM=xterm-256color; ssh -tt -i /tmp/herdr_applicant_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes apply@join.herdr.dev" /tmp/herdr_session.log'
          echo '--- RAW SESSION BASE64 ---'
          base64 -w0 /tmp/herdr_session.log || true
          echo
          rm -f /tmp/herdr_applicant_key /tmp/herdr_applicant_key.pub
          exit 0
