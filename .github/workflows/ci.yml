name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Run Python harness
        run: python3 scripts/hermetic_agents_demo.py --self-test

      - name: Run Bazel e2e test
        run: bazel test //:hermetic_agents_e2e_test
