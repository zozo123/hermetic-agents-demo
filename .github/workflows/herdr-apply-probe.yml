name: herdr-apply-probe

on:
  push:
    paths:
      - '.github/workflows/herdr-apply-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Render Herdr application screen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pexpect pyte
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 join.herdr.dev >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -q -t ed25519 -N '' -f /tmp/herdr_applicant_key
          python3 - <<'PY'
          import os, time
          import pexpect, pyte

          cmd = "ssh -tt -i /tmp/herdr_applicant_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes apply@join.herdr.dev"
          env = os.environ.copy()
          env["TERM"] = "xterm-256color"
          child = pexpect.spawn("/bin/bash", ["-lc", cmd], env=env, encoding=None, timeout=1)
          child.setwinsize(45, 140)

          screen = pyte.Screen(140, 45)
          stream = pyte.Stream(screen)
          deadline = time.time() + 10
          while time.time() < deadline:
              try:
                  chunk = child.read_nonblocking(size=4096, timeout=0.5)
                  if chunk:
                      stream.feed(chunk.decode("utf-8", "replace"))
              except pexpect.TIMEOUT:
                  pass
              except pexpect.EOF:
                  break

          print("--- HERDR VISIBLE SCREEN ---")
          for i, line in enumerate(screen.display, 1):
              text = line.rstrip()
              if text:
                  print(f"{i:02d}: {text}")
          print("--- END SCREEN ---")
          child.close(force=True)
          PY
          rm -f /tmp/herdr_applicant_key /tmp/herdr_applicant_key.pub
